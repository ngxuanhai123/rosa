<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="color-scheme" content="dark">
  <title>Daily Holy Rosary</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✝️</text></svg>">

  <style>
    :root {
      --bg: #07111f;
      --surface: rgba(11, 25, 43, 0.84);
      --surface-strong: rgba(9, 21, 37, 0.96);
      --surface-soft: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.13);
      --border-strong: rgba(245, 196, 92, 0.45);
      --text: #f8fafc;
      --muted: #a8b3c4;
      --gold: #f5c45c;
      --gold-deep: #c9962f;
      --danger: #ffb4b4;
      --success: #9fe6bc;
      --shadow: 0 28px 80px rgba(0, 0, 0, 0.45);
      --radius-xl: 30px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(135deg, rgba(2, 9, 18, 0.82), rgba(7, 17, 31, 0.92)),
        url("https://images.unsplash.com/photo-1437603568260-1950d3ca6eab?q=85&w=2200&auto=format&fit=crop") center/cover fixed;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 15% 10%, rgba(245, 196, 92, 0.17), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(47, 118, 172, 0.16), transparent 28%);
    }

    button, input, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .app-shell {
      position: relative;
      z-index: 1;
      width: min(1180px, 100%);
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      padding: calc(24px + var(--safe-top)) 24px calc(24px + var(--safe-bottom));
      display: grid;
      align-content: center;
      gap: 18px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 48px;
      height: 48px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid var(--border-strong);
      border-radius: 50%;
      background: linear-gradient(145deg, rgba(245,196,92,.22), rgba(255,255,255,.05));
      color: var(--gold);
      font-family: Georgia, serif;
      font-size: 27px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }

    .brand-copy { min-width: 0; }

    .brand-title {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.05rem, 2.4vw, 1.35rem);
      font-weight: 700;
      letter-spacing: .035em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-subtitle {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: .82rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .date-chip {
      max-width: 48%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(8, 19, 33, 0.72);
      color: var(--gold);
      font-size: .84rem;
      font-weight: 650;
      text-align: center;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .main-card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      background: linear-gradient(145deg, rgba(16, 34, 56, .90), rgba(8, 20, 35, .94));
      box-shadow: var(--shadow);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    .main-card::after {
      content: "†";
      position: absolute;
      right: -22px;
      bottom: -86px;
      color: rgba(255,255,255,.025);
      font-family: Georgia, serif;
      font-size: 20rem;
      line-height: 1;
      pointer-events: none;
    }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.06fr) minmax(360px, .94fr);
      min-height: 610px;
    }

    .visual-panel {
      position: relative;
      min-height: 610px;
      overflow: hidden;
      background: #08111d;
    }

    .visual-panel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity .35s ease, transform .8s ease;
    }

    .visual-panel:hover img { transform: scale(1.025); }

    .visual-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(to top, rgba(3, 10, 19, .92) 0%, rgba(3, 10, 19, .18) 55%, rgba(3, 10, 19, .18) 100%),
        linear-gradient(to right, transparent 70%, rgba(8,20,35,.65));
      pointer-events: none;
    }

    .visual-copy {
      position: absolute;
      z-index: 2;
      left: 0;
      right: 0;
      bottom: 0;
      padding: clamp(24px, 4vw, 42px);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 13px;
      color: var(--gold);
      font-size: .78rem;
      font-weight: 750;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 28px;
      height: 1px;
      background: currentColor;
    }

    .mystery-title {
      margin: 0;
      max-width: 680px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.1rem, 5vw, 4.35rem);
      line-height: .98;
      letter-spacing: -.025em;
      text-shadow: 0 5px 30px rgba(0,0,0,.55);
    }

    .mystery-subtitle {
      margin: 13px 0 0;
      color: rgba(255,255,255,.78);
      font-size: clamp(.95rem, 1.6vw, 1.08rem);
    }

    .control-panel {
      position: relative;
      z-index: 2;
      padding: clamp(24px, 4vw, 42px);
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .section-label {
      margin: 0 0 9px;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 760;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 5px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255,255,255,.045);
    }

    .segmented button,
    .mystery-button,
    .icon-button,
    .primary-button,
    .speed-button,
    .mode-button {
      border: 0;
      color: inherit;
      cursor: pointer;
    }

    .segmented button {
      min-height: 42px;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      transition: .2s ease;
    }

    .segmented button:hover { color: var(--text); background: rgba(255,255,255,.06); }
    .segmented button.active {
      background: linear-gradient(135deg, rgba(245,196,92,.24), rgba(255,255,255,.08));
      color: var(--gold);
      box-shadow: inset 0 0 0 1px rgba(245,196,92,.3);
    }

    .mode-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .mode-button {
      min-height: 38px;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255,255,255,.04);
      color: var(--muted);
      font-size: .78rem;
      font-weight: 700;
    }

    .mode-button.active {
      border-color: rgba(245,196,92,.34);
      color: var(--gold);
      background: rgba(245,196,92,.08);
    }

    .mystery-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }

    .mystery-button {
      position: relative;
      min-height: 66px;
      padding: 12px 13px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255,255,255,.035);
      text-align: left;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }

    .mystery-button:hover { transform: translateY(-1px); background: rgba(255,255,255,.065); }
    .mystery-button.active {
      border-color: var(--border-strong);
      background: linear-gradient(135deg, rgba(245,196,92,.17), rgba(255,255,255,.05));
    }

    .mystery-button strong {
      display: block;
      font-size: .91rem;
    }

    .mystery-button small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: .72rem;
    }

    .player-card {
      margin-top: auto;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: linear-gradient(145deg, rgba(255,255,255,.075), rgba(255,255,255,.03));
    }

    .now-playing {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .album-mark {
      width: 50px;
      height: 50px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid rgba(245,196,92,.3);
      border-radius: 15px;
      background: rgba(245,196,92,.11);
      color: var(--gold);
      font-family: Georgia, serif;
      font-size: 24px;
    }

    .track-meta { min-width: 0; }

    .track-name {
      margin: 0;
      font-weight: 760;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-status {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: .78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .progress-wrap { margin-bottom: 12px; }

    .range {
      width: 100%;
      height: 5px;
      margin: 0;
      appearance: none;
      border-radius: 999px;
      background: linear-gradient(to right, var(--gold) var(--range-progress, 0%), rgba(255,255,255,.14) var(--range-progress, 0%));
      outline: none;
      cursor: pointer;
    }

    .range::-webkit-slider-thumb {
      width: 16px;
      height: 16px;
      appearance: none;
      border: 3px solid var(--surface-strong);
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 0 2px rgba(245,196,92,.2);
    }

    .range::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border: 3px solid var(--surface-strong);
      border-radius: 50%;
      background: var(--gold);
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      margin-top: 7px;
      color: var(--muted);
      font-size: .72rem;
      font-variant-numeric: tabular-nums;
    }

    .main-controls {
      display: grid;
      grid-template-columns: 44px 1fr 64px 1fr 44px;
      align-items: center;
      gap: 10px;
    }

    .icon-button,
    .speed-button {
      display: grid;
      place-items: center;
      min-width: 42px;
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: rgba(255,255,255,.045);
      color: var(--text);
    }

    .icon-button:hover,
    .speed-button:hover { background: rgba(255,255,255,.085); }

    .primary-button {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: linear-gradient(145deg, #ffd778, #e3a935);
      color: #111827;
      box-shadow: 0 12px 30px rgba(227,169,53,.28);
      transition: transform .18s ease;
    }

    .primary-button:hover { transform: scale(1.035); }
    .primary-button:active { transform: scale(.97); }
    .primary-button:disabled,
    .icon-button:disabled,
    .range:disabled { opacity: .42; cursor: not-allowed; }

    .speed-button {
      font-size: .75rem;
      font-weight: 800;
    }

    .volume-row {
      display: grid;
      grid-template-columns: 34px 1fr;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
    }

    .volume-row .range { height: 4px; }

    .message {
      display: none;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: .78rem;
      line-height: 1.45;
    }

    .message.show { display: block; }
    .message.error { color: var(--danger); background: rgba(255, 100, 100, .08); border: 1px solid rgba(255, 180, 180, .18); }
    .message.success { color: var(--success); background: rgba(94, 215, 143, .08); border: 1px solid rgba(159, 230, 188, .16); }

    .autoplay-gate {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      place-items: center;
      padding: 24px;
      background: rgba(2, 8, 16, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .autoplay-gate.show { display: grid; }

    .autoplay-dialog {
      width: min(390px, 100%);
      padding: 30px 24px 25px;
      border: 1px solid rgba(245, 196, 92, 0.42);
      border-radius: 26px;
      background: linear-gradient(145deg, rgba(16, 34, 56, .98), rgba(7, 17, 31, .98));
      box-shadow: 0 28px 90px rgba(0,0,0,.62);
      text-align: center;
    }

    .autoplay-rosary {
      width: 92px;
      height: 92px;
      margin: 0 auto 17px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(245,196,92,.34);
      border-radius: 50%;
      color: var(--gold);
      background:
        radial-gradient(circle at center, rgba(245,196,92,.16), transparent 54%),
        rgba(255,255,255,.035);
      font-family: Georgia, serif;
      font-size: 42px;
      box-shadow: 0 0 0 10px rgba(245,196,92,.035), 0 14px 40px rgba(0,0,0,.35);
    }

    .autoplay-dialog h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.55rem;
    }

    .autoplay-dialog p {
      margin: 10px 0 22px;
      color: var(--muted);
      line-height: 1.55;
      font-size: .9rem;
    }

    .autoplay-start {
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 15px;
      background: linear-gradient(145deg, #ffd778, #e3a935);
      color: #111827;
      font-weight: 820;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(227,169,53,.24);
    }

    .message.info { color: #d9e9ff; background: rgba(88, 166, 255, .08); border: 1px solid rgba(165, 207, 255, .16); }

    .footer {
      display: flex;
      justify-content: center;
      color: rgba(255,255,255,.42);
      font-family: Georgia, serif;
      font-size: .72rem;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    svg { width: 22px; height: 22px; fill: currentColor; }

    @media (max-width: 900px) {
      .app-shell { width: min(720px, 100%); align-content: start; }
      .content-grid { grid-template-columns: 1fr; min-height: 0; }
      .visual-panel { min-height: 360px; }
      .visual-panel::before { background: linear-gradient(to top, rgba(3,10,19,.94), rgba(3,10,19,.08) 75%); }
      .control-panel { padding-top: 28px; }
      .mystery-title { font-size: clamp(2.25rem, 8vw, 4rem); }
      .main-card::after { display: none; }
    }

    @media (max-width: 600px) {
      body { background-attachment: scroll; }
      .app-shell { padding: calc(14px + var(--safe-top)) 12px calc(16px + var(--safe-bottom)); gap: 12px; }
      .topbar { align-items: flex-start; }
      .brand-mark { width: 42px; height: 42px; font-size: 23px; }
      .brand-subtitle { display: none; }
      .date-chip { max-width: 53%; padding: 9px 11px; font-size: .72rem; line-height: 1.25; }
      .main-card { border-radius: 23px; }
      .visual-panel { min-height: 305px; }
      .visual-copy { padding: 24px 22px; }
      .mystery-title { font-size: clamp(2rem, 10.5vw, 3.15rem); }
      .control-panel { padding: 22px 16px 18px; gap: 18px; }
      .mystery-grid { gap: 7px; }
      .mystery-button { min-height: 62px; padding: 10px 11px; }
      .player-card { padding: 15px; }
      .main-controls { grid-template-columns: 42px 1fr 60px 1fr 42px; gap: 8px; }
      .primary-button { width: 60px; height: 60px; }
      .footer { font-size: .64rem; }
    }

    @media (max-width: 390px) {
      .brand-title { font-size: 1rem; }
      .date-chip { font-size: .67rem; }
      .mystery-grid { grid-template-columns: 1fr 1fr; }
      .mystery-button strong { font-size: .82rem; }
      .mystery-button small { font-size: .66rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="autoplay-gate" id="autoplayGate" aria-hidden="true">
    <div class="autoplay-dialog" role="dialog" aria-modal="true" aria-labelledby="autoplayTitle" aria-describedby="autoplayText">
      <div class="autoplay-rosary" aria-hidden="true">☩</div>
      <h2 id="autoplayTitle">Chạm để bắt đầu</h2>
      <p id="autoplayText">Trình duyệt đang chặn âm thanh tự động. Chỉ cần chạm một lần để bắt đầu lần chuỗi.</p>
      <button class="autoplay-start" id="autoplayStartButton" type="button">Bắt đầu lần chuỗi</button>
    </div>
  </div>

  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">☩</div>
        <div class="brand-copy">
          <h1 class="brand-title">Daily Holy Rosary</h1>
          <p class="brand-subtitle">Pray with peace, every day</p>
        </div>
      </div>
      <div class="date-chip" id="dateDisplay">—</div>
    </header>

    <section class="main-card" aria-labelledby="mysteryName">
      <div class="content-grid">
        <div class="visual-panel">
          <img id="mysteryImage" alt="" decoding="async" fetchpriority="high">
          <div class="visual-copy">
            <div class="eyebrow" id="todayLabel">Hôm nay</div>
            <h2 class="mystery-title" id="mysteryName">Năm Sự Mừng</h2>
            <p class="mystery-subtitle" id="mysterySubtitle">Thứ Tư &amp; Chúa Nhật</p>
          </div>
        </div>

        <div class="control-panel">
          <div>
            <p class="section-label" id="languageLabel">Ngôn ngữ</p>
            <div class="segmented" role="group" aria-labelledby="languageLabel">
              <button type="button" data-lang="vi" class="active" aria-pressed="true">🇻🇳 Việt</button>
              <button type="button" data-lang="en" aria-pressed="false">🇺🇸 English</button>
              <button type="button" data-lang="id" aria-pressed="false">🇮🇩 Indonesia</button>
            </div>
          </div>

          <div>
            <div class="mode-row">
              <p class="section-label" id="mysteryLabel">Mầu nhiệm</p>
              <button class="mode-button active" id="dailyModeButton" type="button">Theo ngày</button>
            </div>
            <div class="mystery-grid" id="mysteryGrid"></div>
          </div>

          <div class="player-card">
            <div class="now-playing">
              <div class="album-mark" aria-hidden="true">☩</div>
              <div class="track-meta">
                <p class="track-name" id="trackName">Năm Sự Mừng</p>
                <p class="track-status" id="trackStatus">Sẵn sàng phát</p>
              </div>
            </div>

            <div class="progress-wrap">
              <label class="sr-only" for="progressRange" id="progressLabel">Tiến trình phát</label>
              <input class="range" id="progressRange" type="range" min="0" max="100" step="0.1" value="0" aria-describedby="timeCurrent timeDuration">
              <div class="time-row">
                <span id="timeCurrent">0:00</span>
                <span id="timeDuration">0:00</span>
              </div>
            </div>

            <div class="main-controls">
              <button class="speed-button" id="speedButton" type="button" aria-label="Tốc độ phát">1×</button>
              <button class="icon-button" id="backButton" type="button" aria-label="Lùi 15 giây">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 8v5.17l3.59 2.08.75-1.3-2.84-1.63V8H11Zm1-5a9 9 0 1 0 8.65 6.5h-2.08A7 7 0 1 1 12 5c1.61 0 3.09.55 4.27 1.47L14 8.74h6V2.73l-2.31 2.31A8.93 8.93 0 0 0 12 3Z"/></svg>
              </button>
              <button class="primary-button" id="playButton" type="button" aria-label="Phát">
                <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7L8 5Z"/></svg>
              </button>
              <button class="icon-button" id="forwardButton" type="button" aria-label="Tới 15 giây">

      if (!Number.isFinite(seconds) || seconds < 0) return "0:00";
      const total = Math.floor(seconds);
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const secs = total % 60;
      return hours > 0
        ? `${hours}:${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`
        : `${minutes}:${String(secs).padStart(2, "0")}`;

      els.progressLabel.textContent = copy.progress;
      els.volumeLabel.textContent = copy.volume;
      els.autoplayTitle.textContent = copy.tapToStart;
      els.autoplayText.textContent = copy.autoplayBlocked;
      els.autoplayStartButton.textContent = copy.startPrayer;
      updateDate();
      renderLanguageButtons();
      renderMysteryButtons();
      updateVolumeIcon();
    }

    function progressStorageKey() {
      return `rosary_progress_${state.lang}_${state.currentMystery}`;
    }

    function saveProgress() {
      if (!Number.isFinite(els.audio.currentTime) || els.audio.currentTime < 3) return;
      const payload = {
        time: els.audio.currentTime,
        duration: els.audio.duration || 0,
        savedAt: Date.now()
      };
      localStorage.setItem(progressStorageKey(), JSON.stringify(payload));
    }

    function restoreProgress() {
      try {
        const raw = localStorage.getItem(progressStorageKey());
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (!saved || !Number.isFinite(saved.time)) return;
        const duration = els.audio.duration;
        const nearEnd = duration && saved.time > duration - 20;
        const stale = Date.now() - saved.savedAt > 1000 * 60 * 60 * 24 * 30;
        if (!nearEnd && !stale && saved.time > 5) {
          els.audio.currentTime = Math.min(saved.time, Math.max(0, duration - 1));
          setMessage(COPY[state.lang].resume, "success");
          setTimeout(() => setMessage(""), 3000);
        }
      } catch (error) {
        console.warn("Could not restore progress", error);
      }
    }

    function updateMediaSession(item) {
      if (!("mediaSession" in navigator)) return;
      try {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: item.name,
          artist: "Daily Holy Rosary",
          album: COPY[state.lang].today,
          artwork: [
            { src: IMAGES[state.currentMystery], sizes: "1120x830", type: "image/svg+xml" }
          ]
        });
      } catch (error) {
        console.warn("Media Session metadata unavailable", error);
      }
    }

    function showAutoplayGate(show) {
      els.autoplayGate.classList.toggle("show", show);
      els.autoplayGate.setAttribute("aria-hidden", String(!show));
      if (show) {
        setTimeout(() => els.autoplayStartButton.focus({ preventScroll: true }), 0);
      }
    }

    async function attemptAutoplay() {
      if (!els.audio.src) return false;
      try {
        await els.audio.play();
        showAutoplayGate(false);
        setMessage("");
        return true;
      } catch (error) {
        const copy = COPY[state.lang];
        els.trackStatus.textContent = copy.ready;
        if (error && error.name === "NotAllowedError") {
          showAutoplayGate(true);
          setMessage(copy.autoplayBlocked, "info");
        } else {
          setMessage(copy.loadError, "error");
        }
        return false;
      }
    }

    function loadCurrentTrack({ autoplay = false } = {}) {
      saveProgress();
      state.currentMystery = getCurrentMystery();
      const copy = COPY[state.lang];
      const item = copy.mysteries[state.currentMystery];

      els.name.textContent = item.name;
      els.subtitle.textContent = item.sub;
      els.trackName.textContent = item.name;
      els.trackStatus.textContent = item.url ? copy.loading : copy.unavailable;
      els.image.alt = item.name;
      els.image.style.opacity = "0";
      els.image.src = IMAGES[state.currentMystery];
      els.image.onload = () => { els.image.style.opacity = "1"; };

      document.querySelectorAll("[data-mystery]").forEach(button => {
        const active = button.dataset.mystery === state.currentMystery;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });

      els.dailyModeButton.classList.toggle("active", state.mode === "daily");
      els.dailyModeButton.textContent = state.mode === "daily" ? copy.dailyMode : copy.manualMode;
      els.progress.value = 0;
      setRangeProgress(els.progress, 0);
      els.timeCurrent.textContent = "0:00";
      els.timeDuration.textContent = "0:00";
      updatePlayIcon(false);
      showAutoplayGate(false);
      setMessage("");

      if (!item.url) {
        els.audio.removeAttribute("src");
        els.audio.load();
        setPlayerEnabled(false);
        setMessage(copy.unavailable, "error");
        return;
      }

      setPlayerEnabled(true);
      els.audio.src = item.url;
      els.audio.load();
      updateMediaSession(item);

      if (autoplay) {
        attemptAutoplay();
      }
    }

    function selectMystery(code) {
      state.mode = "manual";
      state.manualMystery = code;
      localStorage.setItem("rosary_mode", state.mode);
      localStorage.setItem("rosary_manual_mystery", code);
      loadCurrentTrack({ autoplay: true });
    }

    function setDailyMode() {
      state.mode = "daily";
      localStorage.setItem("rosary_mode", state.mode);
      loadCurrentTrack({ autoplay: true });
    }

    function changeLanguage(lang) {
      if (!COPY[lang]) return;
      state.lang = lang;
      localStorage.setItem("rosary_lang", lang);
      updateStaticCopy();
      loadCurrentTrack({ autoplay: true });
    }

    async function togglePlay() {
      if (!els.audio.src) return;
      if (els.audio.paused) {
        await attemptAutoplay();
      } else {
        els.audio.pause();
      }
    }

    async function requestWakeLock() {
      if (!("wakeLock" in navigator) || state.wakeLock) return;
      try {
        state.wakeLock = await navigator.wakeLock.request("screen");
        state.wakeLock.addEventListener("release", () => { state.wakeLock = null; });
      } catch (_) {}
    }

    async function releaseWakeLock() {
      if (!state.wakeLock) return;
      try { await state.wakeLock.release(); } catch (_) {}
      state.wakeLock = null;
    }

    document.querySelectorAll("[data-lang]").forEach(button => {
      button.addEventListener("click", () => changeLanguage(button.dataset.lang));
    });

    els.dailyModeButton.addEventListener("click", setDailyMode);
    els.playButton.addEventListener("click", togglePlay);
    els.autoplayStartButton.addEventListener("click", attemptAutoplay);
    els.autoplayGate.addEventListener("click", event => {
      if (event.target === els.autoplayGate) attemptAutoplay();
    });
    els.backButton.addEventListener("click", () => {
      els.audio.currentTime = Math.max(0, els.audio.currentTime - 15);
    });
    els.forwardButton.addEventListener("click", () => {
      els.audio.currentTime = Math.min(els.audio.duration || Infinity, els.audio.currentTime + 15);
    });

    els.progress.addEventListener("input", () => {
      state.isSeeking = true;
      const ratio = Number(els.progress.value) / 100;
      setRangeProgress(els.progress, ratio);
      els.timeCurrent.textContent = formatTime((els.audio.duration || 0) * ratio);
    });

    els.progress.addEventListener("change", () => {
      if (Number.isFinite(els.audio.duration)) {
        els.audio.currentTime = els.audio.duration * (Number(els.progress.value) / 100);
      }
      state.isSeeking = false;
    });

    els.volume.addEventListener("input", () => {
      const volume = Number(els.volume.value);
      els.audio.volume = volume;
      els.audio.muted = false;
      localStorage.setItem("rosary_volume", String(volume));
      setRangeProgress(els.volume, volume);
      updateVolumeIcon();
    });

    els.muteButton.addEventListener("click", () => {
      els.audio.muted = !els.audio.muted;
      updateVolumeIcon();
    });

    els.speedButton.addEventListener("click", () => {
      const currentIndex = SPEEDS.indexOf(els.audio.playbackRate);
      const nextRate = SPEEDS[(currentIndex + 1) % SPEEDS.length];
      els.audio.playbackRate = nextRate;
      els.speedButton.textContent = `${nextRate}×`;
      localStorage.setItem("rosary_rate", String(nextRate));
    });

    els.audio.addEventListener("loadedmetadata", () => {
      state.duration = els.audio.duration || 0;
      els.timeDuration.textContent = formatTime(state.duration);
      els.trackStatus.textContent = COPY[state.lang].ready;
      restoreProgress();
    });

    els.audio.addEventListener("timeupdate", () => {
      if (!state.isSeeking && Number.isFinite(els.audio.duration) && els.audio.duration > 0) {
        const ratio = els.audio.currentTime / els.audio.duration;
        els.progress.value = ratio * 100;
        setRangeProgress(els.progress, ratio);
        els.timeCurrent.textContent = formatTime(els.audio.currentTime);
      }
      if ("mediaSession" in navigator && Number.isFinite(els.audio.duration) && els.audio.duration > 0) {
        try {
          navigator.mediaSession.setPositionState({
            duration: els.audio.duration,
            playbackRate: els.audio.playbackRate,
            position: Math.min(els.audio.currentTime, els.audio.duration)
          });
        } catch (_) {}
      }
    });

    els.audio.addEventListener("play", () => {
      els.trackStatus.textContent = COPY[state.lang].playing;
      updatePlayIcon(true);
      requestWakeLock();
      if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
    });

    els.audio.addEventListener("pause", () => {
      if (!els.audio.ended) els.trackStatus.textContent = COPY[state.lang].paused;
      updatePlayIcon(false);
      saveProgress();
      releaseWakeLock();
      if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
    });

    els.audio.addEventListener("ended", () => {
      els.trackStatus.textContent = COPY[state.lang].ended;
      updatePlayIcon(false);
      localStorage.removeItem(progressStorageKey());
      releaseWakeLock();
    });

    els.audio.addEventListener("waiting", () => {
      els.trackStatus.textContent = COPY[state.lang].loading;
    });

    els.audio.addEventListener("error", () => {
      els.trackStatus.textContent = COPY[state.lang].loadError;
      setMessage(COPY[state.lang].loadError, "error");
      setPlayerEnabled(false);
    });

    window.addEventListener("beforeunload", saveProgress);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && !els.audio.paused) requestWakeLock();
      if (document.visibilityState === "hidden") saveProgress();
    });

    document.addEventListener("keydown", event => {
      const target = event.target;
      if (target instanceof HTMLInputElement || target instanceof HTMLButtonElement) return;
      if (event.code === "Space") {
        event.preventDefault();
        togglePlay();
      } else if (event.code === "ArrowLeft") {
        els.audio.currentTime = Math.max(0, els.audio.currentTime - 15);
      } else if (event.code === "ArrowRight") {
        els.audio.currentTime = Math.min(els.audio.duration || Infinity, els.audio.currentTime + 15);
      } else if (event.key.toLowerCase() === "m") {
        els.audio.muted = !els.audio.muted;
        updateVolumeIcon();
      }
    });

    if ("mediaSession" in navigator) {
      const handlers = {
        play: () => els.audio.play(),
        pause: () => els.audio.pause(),
        seekbackward: details => { els.audio.currentTime = Math.max(0, els.audio.currentTime - (details.seekOffset || 15)); },
        seekforward: details => { els.audio.currentTime = Math.min(els.audio.duration || Infinity, els.audio.currentTime + (details.seekOffset || 15)); },
        seekto: details => { if (details.seekTime != null) els.audio.currentTime = details.seekTime; }
      };
      Object.entries(handlers).forEach(([action, handler]) => {
        try { navigator.mediaSession.setActionHandler(action, handler); } catch (_) {}
      });
    }

    function init() {
      if (!COPY[state.lang]) state.lang = "vi";
      if (!ORDER.includes(state.manualMystery)) state.manualMystery = "joyful";
      if (!['daily', 'manual'].includes(state.mode)) state.mode = "daily";

      const savedVolume = Number(localStorage.getItem("rosary_volume"));
      const volume = Number.isFinite(savedVolume) ? Math.min(1, Math.max(0, savedVolume)) : 0.9;
      els.audio.volume = volume;
      els.volume.value = volume;
      setRangeProgress(els.volume, volume);

      const savedRate = Number(localStorage.getItem("rosary_rate"));
      const rate = SPEEDS.includes(savedRate) ? savedRate : 1;
      els.audio.playbackRate = rate;
      els.speedButton.textContent = `${rate}×`;

      updateStaticCopy();
      loadCurrentTrack({ autoplay: true });
    }

    init();
  </script>
</body>
</html>
